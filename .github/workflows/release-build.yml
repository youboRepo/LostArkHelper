name: Build release archives
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: v0.3.4
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build and test standalone Windows folder
        shell: pwsh
        working-directory: windows
        run: ./build-windows.ps1 -Mode onedir -PythonExecutable (Get-Command python).Source
      - name: Test packaged self-update and restart
        working-directory: windows
        run: python tests/smoke_upgrade.py release/LostArkHelper/LostArkHelper.exe
      - name: Create ZIP
        shell: pwsh
        run: python tools/package_release.py windows --version '${{ inputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-archive
          path: release-assets/*.zip
          if-no-files-found: error
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: linux/web/package-lock.json
      - name: Rebuild Linux workbench
        working-directory: linux/web
        run: |
          npm ci
          npm run build -- --outDir ../dist --emptyOutDir
      - name: Build and test standalone Linux folder
        run: |
          python -m pip install -r linux/requirements-build.txt
          bash linux/build-linux.sh
      - name: Test packaged self-update and restart
        run: python linux/tests/smoke_upgrade.py linux/release/LostArkHelper-Linux-x64/LostArkHelper
      - name: Create tar archive
        run: python tools/package_release.py linux --version '${{ inputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: release-assets/*.tar.gz
          if-no-files-found: error
  server:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify server, iPhone graph and four-edition activity policy
        run: |
          python -m unittest discover -s server/tests -v
          python -m unittest discover -s shortcuts/tests -v
          python verify_activity.py
      - name: Create server archive
        run: python tools/package_release.py server --version '${{ inputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: server-archive
          path: release-assets/*.tar.gz
          if-no-files-found: error
  publish:
    needs: [windows, linux, server]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-archive'
          path: release-assets
          merge-multiple: true
      - name: Verify archives and publish tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          cp "shortcuts/releases/LostArkHelper-iPhone-${RELEASE_VERSION}.shortcut" release-assets/
          python tools/verify_release.py --version "$RELEASE_VERSION"
          cp "docs/releases/${RELEASE_VERSION}.md" release-notes.md
          printf '\n构建源码：%s。\n\n构建与测试：https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> release-notes.md
          if gh release view "$RELEASE_VERSION" --json isDraft > existing-release.json 2>/dev/null; then
            python -c "import json; assert json.load(open('existing-release.json'))['isDraft'], 'Published versions cannot be overwritten'"
          else
            gh release create "$RELEASE_VERSION" --target "$GITHUB_SHA" --draft --title "$RELEASE_VERSION" --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_VERSION" --target "$GITHUB_SHA" --title "$RELEASE_VERSION · 命运方舟助手" --notes-file release-notes.md
          gh release upload "$RELEASE_VERSION" release-assets/* --clobber
          gh release edit "$RELEASE_VERSION" --draft=false --latest
