name: Server regression tests

on:
  pull_request:
    paths:
      - 'server/**'
      - 'activity-manifest.json'
      - 'verify_activity.py'
      - '.github/workflows/server-tests.yml'

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test server with mocked game APIs
        run: python -m unittest discover -s server/tests -v
      - name: Check four-edition activity policy
        run: python verify_activity.py
